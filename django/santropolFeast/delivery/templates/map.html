{% extends "base.html" %}
<!-- Load internationalisation utils-->
{% load i18n %}

{% load staticfiles %}


{% block title %}Map{% endblock %}

{% block extrahead %}
    {% load leaflet_tags %}
    {% leaflet_js %}
    {% leaflet_css %}
    <link href="{% static 'leaflet-routing/leaflet-routing-machine.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
<script src="{% static 'leaflet-routing/leaflet-routing-machine.js' %}" type="application/javascript"></script>

<h1>Map</h1>
<script type="text/javascript">
    function main_map_init (map, options) {
        // Use Leaflet API here

        // create a new tile layer
        var tileUrl = 'https://{s}.tile.thunderforest.com/cycle/{z}/{x}/{y}.png',
        layer = new L.TileLayer(tileUrl, {maxZoom: 18});
        // add the layer to the map
        map.addLayer(layer);

         map.setView(new L.LatLng(45.5017, -73.5673), 8);
         L.marker([45.5017, -73.5673]).addTo(map);


         L.Routing.control({
              waypoints: [
                L.latLng(45.5017, -73.5673),
                L.latLng(45.5017, -73.5873)
              ]
            }).addTo(map);
    }
</script>
{% leaflet_map "main" callback="main_map_init" %}


{% endblock %}
